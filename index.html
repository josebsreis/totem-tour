 shift = Math.max(0, Math.round(mid - tip.offsetWidth / 2));\n      tip.style['margin' + p[2]] = shift + 'px';\n      point.style['padding' + p[2]] = Math.max(10, Math.round(mid - shift - 8)) + 'px';\n    });\n  };\n  setTimeout(align, 0); setTimeout(align, 400); setTimeout(align, 1300);\n\n  var current = function () {\n    var c = skin.querySelector('.tb-crumbs [data-tour-current]');\n    return c ? c.getAttribute('data-tour-scene') : null;\n  };\n  // Fade out, then go.\n  var leave = function () {\n    if (gone) return; gone = true; clearTimeout(timer);\n    tips.classList.add('is-leaving');\n    setTimeout(function () { if (gone) tips.classList.add('is-done'); }, 450);\n  };\n  // Show for a while, in this room.\n  var show = function (ms) {\n    gone = false; here = current();\n    tips.classList.remove('is-leaving', 'is-done');\n    clearTimeout(timer); timer = setTimeout(leave, ms);\n  };\n  show(10000);\n\n  // Gone the moment the room changes.\n  var crumbs = skin.querySelector('.tb-crumbs');\n  if (crumbs && window.MutationObserver) {\n    new MutationObserver(function () {\n      var now = current(); if (!now) return;\n      if (!here) { here = now; return; }\n      if (now !== here) leave();\n    }).observe(crumbs, { subtree: true, childList: true, attributes: true, attributeFilter: ['data-tour-current'] });\n  }\n\n  // Again when the headset goes on: by then the first ten seconds are long\n  // over, and a visitor in VR needs telling just as much. The player marks the\n  // page with data-in-xr while a session runs.\n  if (window.MutationObserver) {\n    var root = document.documentElement;\n    var xr = new MutationObserver(function () {\n      if (!skin.isConnected) { xr.disconnect(); return; }\n      if (root.getAttribute('data-in-xr') === 'on') show(15000);\n    });\n    xr.observe(root, { attributes: true, attributeFilter: ['data-in-xr'] });\n  }\n})();\n\u003c/script>\n\n\n\n\n\u003cdiv class=\"tb-loading\" role=\"status\" aria-live=\"polite\">\ gth) return;\n    var i = -1; items.forEach(function (el, k) { if (el.hasAttribute('data-tour-current')) i = k; });\n    items[((i \u003c 0 ? -1 : i) + 1) % items.length].click();\n  });\n})();\n\u003c/script>\n\n\n\u003c/div>","css":":root {\n  --tb-glass: rgba(18, 18, 20, 0.26);\n  --tb-hi: rgba(255, 255, 255, 0.12);\n  --tb-hi-2: rgba(255, 255, 255, 0.22);\n  --tb-line: rgba(255, 255, 255, 0.24);\n  --tb-text: #ffffff;\n  --tb-muted: rgba(255, 255, 255, 0.84);\n  --tb-solid: #ffffff;\n  --tb-solid-hi: #f1f1f2;\n  --tb-ink: #0d0d0f;\n  --tb-ease: cubic-bezier(0.2, 0.8, 0.2, 1);\n\n  --tb-font: \"Poppins\", \"Segoe UI\", system-ui, -apple-system, Roboto, Arial, sans-serif;\n}\n\n.tour-skin { font-family: var(--tb-font); color: var(--tb-text); }\n\n.tb-bar {\n  position: absolute;\n  left: 50%;\n  bottom: 22px;\n  bottom: max(22px, env(safe-area-inset-bottom));\n  transform: translateX(-50%);\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  max-width: calc(100vw - 32px);\n  padding: 8px;\n  background-color: var(--tb-glass);\n  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.06));\n  border: 1px solid var(--tb-line);\n  border-radius: 999px;\n  -webkit-backdrop-filter: blur(7px) saturate(1.7) brightness(0.92);\n  backdrop-filter: blur(7px) saturate(1.7) brightness(0.92);\n  box-shadow:\n    0 22px 50px -18px rgba(0, 0, 0, 0.55),\n    inset 0 1px 0 rgba(255, 255, 255, 0.38),\n    inset 0 -1px 0 rgba(255, 255, 255, 0.08);\n  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);\n  pointer-events: auto;\n  animation: tb-rise 0.7s var(--tb-ease) 0.2s both;\n}\n@keyframes tb-rise {\n  from { opacity: 0; transform: translate(-50%, 26px); }\n  to { opacity: 1; transform: translate(-50%, 0); }\n}\n\n.tb-btn {\n  appearance: none;\n  -webkit-appearance: none;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  min-height: 56px;\n  padding: 0 22px;\n  border: 0;\n  border-radius: 999px;\n isibility: visible; animation: tb-loading-in 0.25s var(--tb-ease) both; }\nhtml[data-in-xr=\"on\"] .tb-loading { visibility: hidden; }\n.tb-loading-dots { display: flex; gap: 5px; }\n.tb-loading-dots i { width: 6px; height: 6px; border-radius: 50%; background-color: #ffffff; animation: tb-loading-dot 1s ease-in-out infinite; }\n.tb-loading-dots i:nth-child(2) { animation-delay: 0.15s; }\n.tb-loading-dots i:nth-child(3) { animation-delay: 0.3s; }\n@keyframes tb-loading-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes tb-loading-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }\n@media (max-width: 560px) { .tb-loading { bottom: 84px; } }\n@media (prefers-reduced-motion: reduce) { .tb-loading, .tb-loading-dots i { animation: none !important; } }"},"runtime":{"autoRotate":{"enabled":false,"speed":0.5,"idleDelayMs":4000},"audio":{"muted":false},"vr":true}}</script>
